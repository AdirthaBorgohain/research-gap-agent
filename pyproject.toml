[project]
name = "research-gap-agent"
version = "0.1.0"
description = "Research Gap Finding Agent using LangGraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "langchain>=1.2.10",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0.9",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
research-gap-agent = "research_gap_agent.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
